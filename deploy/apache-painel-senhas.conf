# Vhost Apache2 para o Painel de Senhas (seção 10 do BLUEPRINT):
# "Apache2 puro com mod_wsgi não sustenta WebSocket bem" -> aqui o Apache2 só faz
# proxy reverso para o Gunicorn (que já está rodando via systemd/painel-senhas.service
# em 127.0.0.1:8000), repassando tanto as rotas HTTP normais quanto o handshake do
# Socket.IO (/socket.io/...) com upgrade de conexão via mod_proxy_wstunnel.
#
# Módulos necessários:
#   sudo a2enmod proxy proxy_http proxy_wstunnel rewrite ssl headers
#   sudo a2ensite painel-senhas
#   sudo systemctl reload apache2
#
# Smart TVs ficam ligadas por dias com a mesma conexão WebSocket aberta - timeouts
# de proxy curtos demais derrubam a conexão sem motivo; os valores abaixo (Timeout,
# ProxyTimeout) já contemplam isso.

<VirtualHost *:80>
    ServerName painel-senhas.exemplo.com.br

    # Redireciona tudo para HTTPS - obrigatório aqui porque a app usa
    # SESSION_COOKIE_SECURE=True em produção (app/config.py): o cookie de sessão do
    # login (admin/recepção/coleta/gerencial) simplesmente não é enviado pelo
    # navegador em HTTP puro, então login nunca funcionaria atrás de Apache só em :80.
    RewriteEngine On
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:443>
    ServerName painel-senhas.exemplo.com.br

    SSLEngine on
    # Ajuste para os caminhos reais do certificado (ex.: Let's Encrypt/certbot)
    SSLCertificateFile /etc/ssl/certs/painel-senhas.crt
    SSLCertificateKeyFile /etc/ssl/private/painel-senhas.key

    Timeout 60
    ProxyTimeout 3600

    RewriteEngine On

    # Handshake/transporte do Socket.IO: detecta o cabeçalho Upgrade e usa o
    # esquema ws:// (mod_proxy_wstunnel) só para essas requisições - todo o resto
    # da aplicação continua em http:// normal via ProxyPass abaixo.
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/socket.io/(.*) ws://127.0.0.1:8000/socket.io/$1 [P,L]
    RewriteCond %{HTTP:Upgrade} !=websocket [NC]
    RewriteRule ^/socket.io/(.*) http://127.0.0.1:8000/socket.io/$1 [P,L]

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    # X-Forwarded-Proto avisa o Flask que a conexão original era HTTPS, mesmo o
    # Gunicorn só vendo HTTP vindo do proxy - necessário para o cookie seguro e
    # para qualquer url_for(..., _external=True) gerar https:// corretamente.
    RequestHeader set X-Forwarded-Proto "https"

    ErrorLog ${APACHE_LOG_DIR}/painel-senhas-error.log
    CustomLog ${APACHE_LOG_DIR}/painel-senhas-access.log combined
</VirtualHost>
