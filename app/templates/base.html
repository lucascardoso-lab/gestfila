<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}GESTFILA{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23FFFFFF'/%3E%3Ctext x='50' y='72' font-family='Arial,sans-serif' font-size='68' font-weight='700' text-anchor='middle' fill='%23C0392B'%3EG%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/gestfila.css') }}">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--gf-cinza-claro);
      color: var(--gf-cinza-escuro);
    }
    .container {
      max-width: 480px;
      margin: 8vh auto;
      background: var(--gf-branco);
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }
    h1 { font-size: 1.5rem; margin-bottom: 1.5rem; }
    label { display: block; margin-bottom: .35rem; font-size: .9rem; color: #555; }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: .65rem .75rem;
      margin-bottom: 1rem;
      border: 1px solid var(--gf-cinza-medio);
      border-radius: 8px;
      font-size: 1rem;
    }
    input[type="text"]:focus, input[type="password"]:focus {
      outline: none;
      border-color: var(--gf-primaria);
      box-shadow: 0 0 0 3px var(--gf-primaria-clara);
    }
    button {
      width: 100%;
      padding: .75rem;
      background: var(--gf-primaria);
      color: var(--gf-branco);
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: var(--gf-primaria-escura); }
    .flash {
      padding: .6rem .8rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: .9rem;
    }
    .flash.error { background: var(--gf-primaria-clara); color: var(--gf-primaria-escura); }
    .flash.info { background: #eaf2f8; color: var(--gf-info); }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    .top-bar a { color: var(--gf-primaria); text-decoration: none; font-size: .9rem; }
  </style>
</head>
<body>
  <div class="container">
    {% block cabecalho_marca %}{% endblock %}
    {% with mensagens = get_flashed_messages(with_categories=true) %}
      {% for categoria, mensagem in mensagens %}
        <div class="flash {{ categoria }}">{{ mensagem }}</div>
      {% endfor %}
    {% endwith %}
    {% block conteudo %}{% endblock %}
  </div>
</body>
</html>
