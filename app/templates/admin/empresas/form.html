{% extends "admin/_layout.html" %}

{% block titulo %}{{ 'Editar empresa' if empresa else 'Nova empresa' }}{% endblock %}

{% block conteudo %}
  <h1>{{ 'Editar empresa' if empresa else 'Nova empresa' }}</h1>
  <div class="card">
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <label for="nome">Nome</label>
      <input type="text" id="nome" name="nome" value="{{ empresa.nome if empresa else '' }}" required autofocus>

      <label for="cnpj">CNPJ (opcional)</label>
      <input type="text" id="cnpj" name="cnpj" value="{{ empresa.cnpj if empresa else '' }}">

      <p><button class="botao" type="submit" style="margin-top:1.5rem;">Salvar</button></p>
    </form>
  </div>
{% endblock %}
