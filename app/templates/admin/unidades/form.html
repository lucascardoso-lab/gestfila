{% extends "admin/_layout.html" %}

{% block titulo %}{{ 'Editar unidade' if unidade else 'Nova unidade' }}{% endblock %}

{% block conteudo %}
  <h1>{{ 'Editar unidade' if unidade else 'Nova unidade' }}</h1>
  {% set nome_tela = self.titulo() %}
  {% include "admin/_breadcrumb.html" %}
  <div class="card">
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <label for="nome">Nome</label>
      <input type="text" id="nome" name="nome" value="{{ unidade.nome if unidade else '' }}" required autofocus>

      <label for="endereco">Endereço (opcional)</label>
      <textarea id="endereco" name="endereco" rows="2" placeholder="Rua, número, bairro, cidade - aparece no cupom impresso do totem">{{ unidade.endereco if unidade else '' }}</textarea>

      <label for="telefone">Telefone (opcional)</label>
      <input type="text" id="telefone" name="telefone" value="{{ unidade.telefone if unidade else '' }}" placeholder="(00) 0000-0000">

      <p><button class="botao" type="submit" style="margin-top:1.5rem;">Salvar</button></p>
    </form>
  </div>
{% endblock %}
