{% extends "base.html" %}

{% block titulo %}Login - GESTFILA{% endblock %}

{% block cabecalho_marca %}
  <div class="gf-marca" style="margin-bottom: 1.75rem;">
    <span class="gf-logo gf-logo--grande"><span class="gf-logo-gest">GEST</span><span class="gf-logo-fila">FILA</span></span>
    <span class="gf-subtitulo">Sistema de Gestão de Atendimento e Filas Virtuais</span>
    <span class="gf-slogan">"Atendimento organizado, rápido e inteligente."</span>
  </div>
{% endblock %}

{% block conteudo %}
  <h1>Entrar</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label for="login">Usuário</label>
    <input type="text" id="login" name="login" autocomplete="username" required autofocus>

    <label for="senha">Senha</label>
    <input type="password" id="senha" name="senha" autocomplete="current-password" required>

    <button type="submit">Entrar</button>
  </form>
{% endblock %}
