<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Relatórios{% endblock %} - GESTFILA</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23FFFFFF'/%3E%3Ctext x='50' y='72' font-family='Arial,sans-serif' font-size='68' font-weight='700' text-anchor='middle' fill='%23C0392B'%3EG%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/gestfila.css') }}">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--gf-cinza-claro);
      color: var(--gf-cinza-escuro);
    }
    nav {
      background: var(--gf-cinza-escuro);
      color: #fff;
      padding: .9rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    nav .grupo-nav-esquerda { display: flex; align-items: center; }
    nav .gf-logo { margin-right: 1.25rem; }
    nav a { color: #cfd6e4; text-decoration: none; margin-right: 1.25rem; font-size: .9rem; padding-bottom: .2rem; border-bottom: 2px solid transparent; }
    nav a:hover { color: #fff; border-bottom-color: var(--gf-primaria); }
    main { max-width: 1100px; margin: 2rem auto; padding: 0 1.5rem; }
    h1 { font-size: 1.4rem; margin-bottom: .25rem; }
    .subtitulo { color: #666; margin-bottom: 1.5rem; font-size: .9rem; }
    .breadcrumb-contexto, .empresa-tag { font-size: .85rem; color: #666; margin-bottom: 1rem; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 10px rgba(0,0,0,.05); }
    th, td { text-align: left; padding: .65rem .9rem; border-bottom: 1px solid #eceef2; font-size: .9rem; }
    th { background: var(--gf-cinza-claro); color: #555; }
    tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: var(--gf-primaria-clara); }
    .badge { display: inline-block; padding: .15rem .55rem; border-radius: 999px; font-size: .75rem; }
    .badge.prioridade { background: var(--gf-primaria-clara); color: var(--gf-primaria-escura); }
    .badge.normal { background: #eceef2; color: #555; }
    .botao {
      display: inline-block; padding: .55rem 1rem; background: var(--gf-primaria); color: #fff;
      border: none; border-radius: 8px; font-size: .9rem; text-decoration: none; cursor: pointer;
    }
    .botao:hover { background: var(--gf-primaria-escura); }
    .filtros { display: flex; flex-wrap: wrap; gap: 1rem; align-items: flex-end; background: #fff; padding: 1.25rem; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.05); margin-bottom: 1.5rem; }
    .filtros > div { display: flex; flex-direction: column; }
    .filtros label { font-size: .8rem; color: #555; margin-bottom: .3rem; }
    .filtros select, .filtros input[type="text"] { padding: .5rem .6rem; border: 1px solid var(--gf-cinza-medio); border-radius: 8px; font-size: .9rem; min-width: 9rem; }
    .exportar { font-size: .85rem; color: #555; margin-bottom: 1.5rem; }
    .exportar a { color: var(--gf-primaria); text-decoration: none; margin-left: .5rem; }
    .menu-relatorios { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
    .menu-relatorios a { display: block; background: #fff; padding: 1.25rem; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.05); text-decoration: none; color: var(--gf-cinza-escuro); font-weight: 600; }
    .menu-relatorios a:hover { box-shadow: 0 2px 10px rgba(192,57,43,.18); }
    .aviso { background: #fdf0e2; color: var(--gf-alerta); padding: .6rem .8rem; border-radius: 8px; font-size: .85rem; margin-bottom: 1.5rem; }
    .card { background: #fff; padding: 1.25rem; border-radius: 12px; border: 1px solid var(--gf-cinza-claro); box-shadow: 0 2px 10px rgba(0,0,0,.05); }
    .dashboard-cartoes { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .cartao { display: flex; flex-direction: column; gap: .35rem; }
    .cartao-numero { font-size: 1.8rem; font-weight: 700; color: var(--gf-primaria); }
    .cartao-label { font-size: .85rem; color: #666; }
    .dashboard-colunas { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.5rem; margin-top: 1.5rem; }
    .dashboard-colunas h2 { font-size: 1.05rem; margin-bottom: .6rem; }
    .alertas .alerta { margin-bottom: .5rem; }
  </style>
</head>
<body>
  <nav>
    <div class="grupo-nav-esquerda">
      <span class="gf-logo gf-logo--navbar gf-logo--claro"><span class="gf-logo-gest">GEST</span><span class="gf-logo-fila">FILA</span></span>
      <a href="{{ url_for('core.index') }}">🏠 Painel de Senhas</a>
      <a href="{{ url_for('core.dashboard') }}">📊 Dashboard</a>
      <a href="{{ url_for('relatorios.index') }}">📈 Relatórios</a>
    </div>
    <a href="{{ url_for('auth.logout') }}">Sair ({{ current_user.nome }})</a>
  </nav>
  <main>
    {% with mensagens = get_flashed_messages(with_categories=true) %}
      {% for categoria, mensagem in mensagens %}
        <div class="flash {{ categoria }}">{{ mensagem }}</div>
      {% endfor %}
    {% endwith %}
    {% block conteudo %}{% endblock %}
  </main>
</body>
</html>
